<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Rounded square background gradient: cyan → blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.22"/>
    </linearGradient>
    <!-- Icon strand gradient: cyan → teal-green -->
    <linearGradient id="strand1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00c9c8"/>
    </linearGradient>
    <linearGradient id="strand2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect width="32" height="32" rx="8" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.45"/>

  <!-- DNA helix — two curved strands + horizontal rungs -->
  <!-- Strand A: sine curve left-to-right (top-to-bottom) -->
  <path d="M 10 5 Q 20 9.5 10 14 Q 20 18.5 10 23 Q 20 27.5 10 32"
        fill="none" stroke="url(#strand1)" stroke-width="2" stroke-linecap="round" clip-path="url(#clip)"/>
  <!-- Strand B: phase-offset sine -->
  <path d="M 22 5 Q 12 9.5 22 14 Q 12 18.5 22 23 Q 12 27.5 22 32"
        fill="none" stroke="url(#strand2)" stroke-width="2" stroke-linecap="round" clip-path="url(#clip)"/>

  <!-- Rungs (horizontal connectors) -->
  <line x1="10" y1="9.5"  x2="22" y2="9.5"  stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round"/>
  <line x1="10" y1="14"   x2="22" y2="14"   stroke="#7fffef" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round"/>
  <line x1="10" y1="18.5" x2="22" y2="18.5" stroke="#00f5a0" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round"/>
  <line x1="10" y1="23"   x2="22" y2="23"   stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- Junction node dots at crossover points -->
  <circle cx="10" cy="9.5"  r="1.6" fill="#00f2fe"/>
  <circle cx="22" cy="9.5"  r="1.6" fill="#00f5a0"/>
  <circle cx="10" cy="14"   r="1.6" fill="#00f5a0"/>
  <circle cx="22" cy="14"   r="1.6" fill="#00f2fe"/>
  <circle cx="10" cy="18.5" r="1.6" fill="#00f2fe"/>
  <circle cx="22" cy="18.5" r="1.6" fill="#00f5a0"/>
  <circle cx="10" cy="23"   r="1.6" fill="#00f5a0"/>
  <circle cx="22" cy="23"   r="1.6" fill="#00f2fe"/>
</svg>
